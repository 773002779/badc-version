spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/release_pipeline_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: root
    password: root
    hikari:
      # Several cached Spring contexts share one MySQL server; keep every pool tiny so the
      # suite never exhausts max_connections.
      maximum-pool-size: 2
      minimum-idle: 0
  flyway:
    clean-disabled: false

# Deterministic test-only credential key. In production the cipher reads the real
# CODING_CRED_KEY environment variable; the value is published in the test resources on
# purpose (Base64 of the 32 ASCII bytes 0123456789abcdef0123456789abcdef) and is not a
# secret. An OS environment variable takes precedence over this property.
CODING_CRED_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

# MockWebServer and local integration tests speak plain HTTP; this test-only switch keeps
# the production HTTPS requirement intact everywhere else.
release:
  engine:
    allow-insecure-http: true
  webhook:
    # Published on purpose: the webhook test signs its own bodies with this value.
    secret: "test-webhook-secret-not-a-real-one"
  reconcile:
    # The suite shares one MySQL schema; tests invoke ReconcileJob.run() explicitly instead
    # of racing a 30s background thread.
    enabled: false
  gate:
    # Same reason: the gate polling / waiver expiry jobs are invoked explicitly by tests.
    reconcile-enabled: false
  freeze:
    # Same reason: the daily 封板 expiry scan is invoked explicitly by the freeze tests.
    expiry-enabled: false
  unit-lease:
    # Same reason: the 60s unit lease renewer is invoked explicitly by its own test.
    renew-enabled: false
  notification:
    # Same reason: the 15s WeCom dispatch loop is invoked explicitly by the notification tests.
    dispatch-enabled: false
    # MockWebServer speaks plain HTTP; the suite publishes its own webhook address.
    allow-insecure-http: true
  approval:
    # Same reason: the 10min approval-SLA scan is invoked explicitly with a fixed clock.
    reminder-enabled: false
  redis:
    enabled: false
  pipeline:
    # Tests drive node handlers themselves; a committed instance stays PENDING until they do.
    auto-start: false
