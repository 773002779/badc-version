# CODING endpoint templates and status vocabulary.
#
# Everything the adapter knows about the CODING API lives here: when the real tenant
# documentation arrives, change this file (or override the same keys from an external
# application.yml / environment) and no Java code has to move.
#
# Placeholder syntax: {variable}. Variables available per action:
#   build.start  : unitId, taskId, branch, commitSha, pipelineNo, attempt
#   build.query  : externalId
#   build.logs   : externalId, offset, limit
#   deploy.start : unitId, taskId, envKind, deName, imageDigest, pipelineNo, attempt
#   deploy.query : externalId
#   deploy.logs  : externalId, offset, limit
#   cancel       : externalId
#   git.head     : unitId, branch
#   git.changes  : unitId, branch, modulePath, baseSha
# A missing/blank variable is an error that names the placeholder; it never renders "".
#
# Map keys that contain a dot use the Spring "[key]" form, otherwise binding would treat
# "build.start" as two nested levels. The job kind selects "build.query"/"build.logs" or
# "deploy.query"/"deploy.logs"; there is no global query action.
#
# Response expressions are the deliberately small JSONPath subset supported by
# JsonPathLite: $.Data.Status, $['Data']['Status'], $.Data.Jobs[0].Status and
# $['Data']['Jobs'][0]['Status']. Wildcards (*), recursive descent (..), filters and
# slices are NOT supported; the adapter rejects such an expression at startup, naming the
# action and expression (no silently-never-matching mapping).
#
# Outbound calls must be HTTPS. For an internal test tenant or MockWebServer only, set
# release.engine.allow-insecure-http=true; it is false by default.
#
# Paths, field names and response expressions below are the documented shape guessed for
# phase 1 — no CODING tenant was reachable to verify them. They are configuration on
# purpose (see docs/tech-design/发版流水线-技术方案-v1.0.md §6.1/§6.2).
coding:
  endpoints:
    "[build.start]":
      method: POST
      url: "/open-api/build/start"
      body: '{"TaskId":"{taskId}","UnitId":{unitId},"Branch":"{branch}","CommitSha":"{commitSha}","PipelineNo":"{pipelineNo}","Attempt":{attempt}}'
      # Used when the pipeline does not know a commit yet (the first build step): the engine
      # builds the branch head. Remove this key to make the regular body (with CommitSha)
      # mandatory for every trigger.
      bodyWithoutCommit: '{"TaskId":"{taskId}","UnitId":{unitId},"Branch":"{branch}","PipelineNo":"{pipelineNo}","Attempt":{attempt}}'
      responseId: "$.Response.Data.JobId"
      # The commit the build actually checks out; absent in responses that have no such field,
      # in which case pipeline_instance.commit_sha stays NULL (no fabricated value).
      responseCommit: "$.Response.Data.CommitSha"
      # responseUrl: "$.Response.Data.WebUrl"   # optional jump URL, unknown from the docs

    "[build.query]":
      method: GET
      url: "/open-api/build/{externalId}"
      responseStatus: "$.Data.Status"
      responseDigest: "$.Data.Digest"

    "[build.logs]":
      method: GET
      url: "/open-api/build/{externalId}/logs?offset={offset}&limit={limit}"

    "[deploy.start]":
      method: POST
      url: "/open-api/deploy/start"
      body: '{"TaskId":"{taskId}","UnitId":{unitId},"EnvKind":"{envKind}","DeName":"{deName}","ImageDigest":"{imageDigest}","PipelineNo":"{pipelineNo}","Attempt":{attempt}}'
      responseId: "$.Data.DeployId"
      # responseUrl: "$.Data.WebUrl"            # optional jump URL, unknown from the docs

    "[deploy.query]":
      method: GET
      url: "/open-api/deploy/{externalId}"
      responseStatus: "$.Data.Status"
      responseDigest: "$.Data.Digest"

    "[deploy.logs]":
      method: GET
      url: "/open-api/deploy/{externalId}/logs?offset={offset}&limit={limit}"

    "[cancel]":
      method: POST
      url: "/open-api/job/{externalId}/cancel"

    # Git commit probe of the rerun planner (Task 15, requirements 4.5 C15). These endpoints
    # are configuration like every other action: the real repository API paths and field names
    # are replaced here once the CODING tenant documentation is available. git.head returns the
    # branch head commit in responseCommit; git.changes returns whether anything under
    # modulePath changed since baseSha in responseValue (true/false, 1/0 or yes/no).
    "[git.head]":
      method: GET
      url: "/open-api/repo/{unitId}/branch/{branch}/head"
      responseCommit: "$.Response.Data.CommitSha"

    "[git.changes]":
      method: GET
      url: "/open-api/repo/{unitId}/changes?branch={branch}&modulePath={modulePath}&baseSha={baseSha}"
      responseValue: "$.Response.Data.Changed"

  # Engine word (case-insensitive) -> platform EngineStatus. A word absent from this map is
  # reported as UNKNOWN (keeping the raw word) and logged at WARN, so an unmapped vocabulary
  # is visible without being mistaken for an engine outage.
  statusMapping:
    QUEUED: [QUEUEING, PENDING]
    RUNNING: [RUNNING, DEPLOYING]
    SUCCESS: [SUCCESS, FINISHED]
    FAILED: [FAILED, ERROR]
    CANCELED: [CANCELED, CANCELLED]

  # CODING webhook payload mapping (tech design §6.3). The field names below are the
  # documented default contract; rename one here when the tenant wraps its callback
  # differently, no code change is needed.
  #
  # kind (default field "kind", values BUILD or DEPLOY, case-insensitive) is REQUIRED: a build
  # job and a deploy job have separate CODING namespaces, so the external id alone cannot tell
  # which node_task a callback belongs to. A delivery with a missing or unknown kind is
  # rejected with HTTP 400 and never touches the database (no dedup row, no task write). The
  # kind also scopes the task lookup: BUILD only matches the build-chain tasks
  # (CODE_CHECK/PKG_BUILD/IMG_BUILD), DEPLOY only DEPLOY/ROLLBACK.
  webhook:
    eventIdField: eventId
    externalIdField: externalId
    statusField: status
    kindField: kind
    digestField: digest
    messageField: message