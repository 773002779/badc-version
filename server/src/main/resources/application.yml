server:
  port: 8080

spring:
  application:
    name: release-pipeline
  config:
    # CODING endpoint templates; external configuration (application.yml outside the jar,
    # environment variables, command line) overrides the same keys without a code change.
    import: classpath:coding-endpoints.yml
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/release_pipeline?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

release:
  engine:
    # Outbound CODING calls require HTTPS. Enable only for an internal test tenant or a
    # local MockWebServer; never for a production connection.
    allow-insecure-http: false
    # Engine implementation looked up in EngineRegistry (phase 1 has CODING only).
    type: CODING
  webhook:
    # Shared HMAC-SHA256 secret of the CODING callback. Empty means fail closed: every
    # callback is rejected with 401 (the application still boots). Inject it from the
    # deployment environment, never commit a real value.
    secret: ${CODING_WEBHOOK_SECRET:}
  reconcile:
    # 30s reconcile loop (tech design §6.3); disable it in environments that run a single
    # externally scheduled reconciler.
    enabled: true
  redis:
    # Redis-backed distributed lock is only wired when explicitly enabled.
    enabled: false
    host: 127.0.0.1
    port: 6379