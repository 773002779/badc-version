server:
  port: 8080

spring:
  application:
    name: release-pipeline
  config:
    # CODING endpoint templates; external configuration (application.yml outside the jar,
    # environment variables, command line) overrides the same keys without a code change.
    import: classpath:coding-endpoints.yml
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/release_pipeline?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

release:
  redis:
    # Redis-backed distributed lock is only wired when explicitly enabled.
    enabled: false
    host: 127.0.0.1
    port: 6379