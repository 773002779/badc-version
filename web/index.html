<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z' stroke='%230e9f6e' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <title>发版流水线</title>
    <script>
      // Applied before first paint: no flash of the wrong theme.
      ;(function () {
        try {
          // ?theme=dark|light wins over the stored preference: shareable, screenshot-friendly.
          var q = new URLSearchParams(location.search).get('theme')
          var saved = q || localStorage.getItem('rp.theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
